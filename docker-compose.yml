# Local production-like run: DB_CONNECTION_STRING=... docker compose up --build
services:
  collective-memory-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: collective-memory-web
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING:?set DB_CONNECTION_STRING}
    restart: unless-stopped
